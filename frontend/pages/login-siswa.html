<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Siswa — E-Learning</title>
  <link rel="stylesheet" href="../css/neo-brutal.css" />
</head>
<body>
  <div class="content" style="max-width:440px">
    <div class="row mb"><a class="nb-btn nb-btn-sm" href="../index.html">← Beranda</a><a class="nb-btn nb-btn-sm nb-btn-dark" href="login-mentor.html">🧑‍🏫 Mentor</a><span style="flex:1"></span><span class="nb-badge blue">LOGIN SISWA</span></div>
    <div class="nb-card">
      <div class="nb-card-header blue">MASUK SEBAGAI SISWA</div>
      <div class="nb-card-body">
        <div id="err"></div>
        <form id="form-login">
          <label class="nb-label" for="username">Username</label>
          <input id="username" class="nb-input" required placeholder="username kamu" autocomplete="username" />
          <label class="nb-label mt" for="password">Password</label>
          <input id="password" class="nb-input" type="password" required placeholder="••••••" autocomplete="current-password" />
          <button class="nb-btn nb-btn-primary nb-btn-block mt" type="submit" id="btn-submit">Masuk →</button>
        </form>
        <p class="nb-hint" style="text-align:center">Belum terdaftar? <a href="auth-register.html"><b>Daftar akun baru →</b></a></p>
        <p class="nb-hint" style="text-align:center">Kamu mentor? <a href="login-mentor.html"><b>Login sebagai Mentor →</b></a></p>
      </div>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script>
    (function () {
      const u = JSON.parse(localStorage.getItem('elearning_user') || 'null');
      if (localStorage.getItem('elearning_token') && u) {
        location.href = u.role === 'mentor' ? 'dashboard-mentor.html' : 'dashboard-siswa.html';
      }
    })();
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.disabled = true; btn.textContent = 'Memeriksa...';
      try {
        const data = await apiFetch('/auth/login-siswa', { method: 'POST', body: { username: username.value, password: password.value } });
        localStorage.setItem('elearning_token', data.token);
        localStorage.setItem('elearning_user', JSON.stringify(data.user));
        location.href = 'dashboard-siswa.html';
      } catch (err) {
        document.getElementById('err').innerHTML = `<div class="nb-alert nb-alert-red mb">⚠ ${esc(err.message)}</div>`;
      } finally { btn.disabled = false; btn.textContent = 'Masuk →'; }
    });
  </script>
</body>
</html>
