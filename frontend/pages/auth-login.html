<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk — E-Learning</title>
  <link rel="stylesheet" href="../css/neo-brutal.css" />
</head>
<body>
  <div class="content" style="max-width:560px">
    <div class="row mb"><a class="nb-btn nb-btn-sm" href="../index.html">← Beranda</a><span class="nb-badge yellow">MASUK</span></div>
    <div class="nb-card">
      <div class="nb-card-header yellow">MASUK SEBAGAI...</div>
      <div class="nb-card-body">
        <div class="grid-2">
          <a class="nb-card nb-card-hover" href="login-siswa.html" style="text-decoration:none">
            <div class="nb-card-header blue">🎒 SISWA</div>
            <div class="nb-card-body"><b>Login dengan username</b><p class="nb-hint">Belajar, kumpulkan tugas, kerjakan kuis.</p></div>
          </a>
          <a class="nb-card nb-card-hover" href="login-mentor.html" style="text-decoration:none">
            <div class="nb-card-header dark">🧑‍🏫 MENTOR</div>
            <div class="nb-card-body"><b>Login dengan email</b><p class="nb-hint">Kelola kelas, materi, dan nilai.</p></div>
          </a>
        </div>
        <p class="nb-hint" style="text-align:center">Belum punya akun? <a href="auth-register.html"><b>Daftar →</b></a></p>
      </div>
    </div>
  </div>
  <script>
    (function () {
      try {
        const u = JSON.parse(localStorage.getItem('elearning_user') || 'null');
        if (localStorage.getItem('elearning_token') && u) {
          location.href = u.role === 'mentor' ? 'dashboard-mentor.html' : 'dashboard-siswa.html';
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
