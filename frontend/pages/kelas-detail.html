<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mengalihkan...</title>
</head>
<body>
  <p>Mengalihkan...</p>
  <script>
    // Pengalih peran: halaman kelas kini terpisah (mentor vs siswa).
    (function () {
      var q = location.search + location.hash;
      var u = null;
      try { u = JSON.parse(localStorage.getItem('elearning_user') || 'null'); } catch (e) {}
      if (!localStorage.getItem('elearning_token') || !u) { location.replace('auth-login.html'); return; }
      location.replace((u.role === 'mentor' ? 'kelas-mentor.html' : 'kelas-siswa.html') + q);
    })();
  </script>
</body>
</html>
