<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Class — Mentor</title>
  <link rel="stylesheet" href="../css/neo-brutal.css" />
</head>
<body data-page="class" data-require="mentor">
<div class="app" id="app">
  <aside class="sidebar" aria-label="Navigasi utama">
    <div class="brand"><span class="brand-mark">E</span> E-LEARNING</div>
    <nav class="nb-nav">
      <div class="nb-navlabel">Mentor</div>
      <a class="nb-navlink" data-nav="dashboard" href="dashboard-mentor.html">📊 Dashboard</a>
      <a class="nb-navlink" data-nav="class" href="class-mentor.html">📚 Class</a>
      <a class="nb-navlink" data-nav="transkrip" href="transkrip-mentor.html">🎓 Transkrip</a>
      <a class="nb-navlink" data-nav="announcement" href="announcement.html">📢 Announcement</a>
      <a class="nb-navlink" data-nav="pantau" href="pantau.html">👁 Pantau Siswa</a>
    </nav>
    <div class="sidebar-footer">
      <div class="profile-chip"><div class="avatar" data-profile-avatar>?</div><div><b data-profile-nama>...</b><br><span class="nb-badge dark" style="font-size:10px" data-profile-role>MENTOR</span></div></div>
      <button class="nb-btn nb-btn-sm nb-btn-block" data-logout>Keluar</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main-col">
    <header class="topbar">
      <button id="btnHamburger" class="nb-btn nb-btn-sm hamburger" aria-expanded="false" aria-label="Buka menu">☰</button>
      <h1 class="page-title">Menu Class</h1>
      <span style="flex:1"></span>
      <div style="position:relative">
        <button id="btn-bell" class="nb-btn nb-btn-sm" aria-label="Notifikasi">🔔 <span id="bell-count" class="nb-badge red" style="font-size:10px">0</span></button>
        <div id="bell-panel" style="display:none;position:absolute;right:0;top:52px;width:min(92vw,340px);z-index:60">
          <div class="nb-card"><div class="nb-card-header yellow"><span>NOTIFIKASI</span><button class="nb-btn nb-btn-sm" id="btn-baca-semua">✓ Dibaca</button></div>
          <div class="nb-card-body" id="bell-list" style="max-height:320px;overflow:auto"><div class="nb-hint">Memuat...</div></div></div>
        </div>
      </div>
    </header>
    <main class="content">
      <div class="grid-2">
        <div class="nb-card">
          <div class="nb-card-header dark">KELAS SAYA (CRUD)</div>
          <div class="nb-card-body"><div class="row" id="list-kelas" style="align-items:stretch"><div class="nb-hint">Memuat...</div></div>
          <p class="nb-hint">Buka kelas untuk: tambah modul teks/file, tambah tugas, lihat tugas siswa.</p></div>
        </div>
        <div class="nb-card">
          <div class="nb-card-header yellow">+ BUAT KELAS</div>
          <div class="nb-card-body">
            <form id="form-kelas">
              <label class="nb-label" for="bk_nama">Nama kelas</label>
              <input id="bk_nama" class="nb-input" required placeholder="cth: Pemrograman Web" />
              <label class="nb-label mt" for="bk_deskripsi">Deskripsi</label>
              <textarea id="bk_deskripsi" class="nb-textarea" rows="3"></textarea>
              <button class="nb-btn nb-btn-primary nb-btn-block mt" type="submit">Buat + Generate Kode →</button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/realtime.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/notifikasi.js"></script>
<script src="../js/layout.js"></script>
<script>
  (async () => {
    await requireAuth();
    async function muat() {
      try {
        const list = await apiFetch('/kelas');
        const box = document.getElementById('list-kelas');
        if (!list.length) { box.innerHTML = `<div class="nb-alert nb-alert-yellow">Belum ada kelas.</div>`; return; }
        box.innerHTML = '';
        const colors = ['yellow', 'blue', 'pink', 'green'];
        list.forEach((k, i) => {
          const el = document.createElement('div');
          el.className = 'nb-card nb-card-hover';
          el.style.cssText = 'flex:1;min-width:220px';
          el.innerHTML = `<div class="nb-card-header ${colors[i % 4]}"><span>${esc(k.nama_kelas)}</span></div>
            <div class="nb-card-body"><span class="nb-code">${esc(k.kode_kelas)}</span>
            <div class="row mt"><a class="nb-btn nb-btn-sm nb-btn-dark" href="kelas-detail.html?id=${k.id}">Kelola →</a>
            <button class="nb-btn nb-btn-sm" data-copy="${esc(k.kode_kelas)}">Copy</button>
            <button class="nb-btn nb-btn-sm" data-regen="${k.id}">↻ Kode</button>
            <button class="nb-btn nb-btn-sm nb-btn-danger" data-hapus="${k.id}">Hapus</button></div></div>`;
          box.appendChild(el);
        });
      } catch (e) { toast(e.message, 'red'); }
    }
    document.addEventListener('click', async (e) => {
      const cp = e.target.closest('[data-copy]');
      if (cp) { await navigator.clipboard.writeText(cp.dataset.copy).catch(() => {}); toast('Kode tersalin', 'green'); }
      const rg = e.target.closest('[data-regen]');
      if (rg && confirm('Buat kode baru? Kode lama hangus.')) {
        try { const k = await apiFetch(`/kelas/${rg.dataset.regen}/regenerate`, { method: 'POST' }); toast('Kode baru: ' + k.kode_kelas, 'green'); muat(); }
        catch (err) { toast(err.message, 'red'); }
      }
      const hp = e.target.closest('[data-hapus]');
      if (hp && confirm('Hapus kelas beserta isinya?')) {
        try { await apiFetch(`/kelas/${hp.dataset.hapus}`, { method: 'DELETE' }); toast('Kelas dihapus', 'green'); muat(); }
        catch (err) { toast(err.message, 'red'); }
      }
    });
    document.getElementById('form-kelas').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const k = await apiFetch('/kelas', { method: 'POST', body: { nama_kelas: bk_nama.value, deskripsi: bk_deskripsi.value } });
        toast('Kelas dibuat! Kode: ' + k.kode_kelas, 'green');
        e.target.reset(); muat();
      } catch (err) { toast(err.message, 'red'); }
    });
    dengarRefresh(muat);
    muat();
  })();
</script>
</body>
</html>
